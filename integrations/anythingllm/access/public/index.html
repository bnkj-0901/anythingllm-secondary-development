<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录与注册 · 知识工作台</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/access/assets/access.css"><script defer src="/access/assets/auth.js"></script></head>
<body><header class="topbar"><a class="brand" href="/h5"><span class="brand-mark" aria-hidden="true">知</span>知识工作台</a><nav aria-label="导航"><a href="/login">原版工作台登录</a></nav></header>
<main class="auth-layout"><section class="auth-intro"><h1>让知识有处可寻。</h1><p>登录你的个人后台，查阅公共资料，整理自己的私有知识。</p><ul class="intro-items"><li>公共知识库，团队一起查阅与问答</li><li>私有知识库，自己的资料独立管理</li><li>电脑与手机浏览器，随时打开使用</li></ul></section>
<section class="panel auth-card" aria-label="账号入口"><div class="tabs" role="tablist" aria-label="登录或注册"><button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="auth-form">账号登录</button><button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="auth-form">自助注册</button></div>
<form id="auth-form"><div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required><small id="username-help">请输入你的登录账号。</small></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="field" id="confirm-field" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"></div><div id="auth-message" class="notice" role="status" aria-live="polite"></div><button class="primary full" id="auth-submit" type="submit">登录个人后台</button></form>
<div class="divider">微信入口</div><button type="button" id="wechat-login" class="full" disabled>微信登录尚未开通</button><p id="wechat-help" class="footnote">微信登录开放后，可在微信内授权登录，或在电脑端扫码登录。当前可直接注册账号使用。</p><p class="footnote">注册后默认为普通用户，可以创建私有知识库。公共知识库由管理员维护。</p></section></main></body></html>
