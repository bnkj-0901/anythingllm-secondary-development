name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    image: anythingllm-secondary-development:local
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "${SERVER_STORAGE_PATH:-../server/storage}:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-3000}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL DATABASE_URL in docker/.env}
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
